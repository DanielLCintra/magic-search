name: CI/CD - Testes e Deploy para S3

on:
  push:
    branches: [main]

jobs:
  test:
    name: 🧪 Rodar Testes (unitários + E2E)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Instala dependências
        run: npm install

      - name: ✅ Roda testes unitários com Jest
        run: npm test

      - name: ✅ Roda Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: http://localhost:3000
          wait-on-timeout: 60

  deploy:
    name: 🚀 Deploy para S3 via Terraform
    runs-on: ubuntu-latest
    needs: test # só roda se o job "test" tiver sucesso

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Instala dependências
        run: npm install

      - name: 🔧 Instala Terraform
        run: |
            sudo apt-get update
            sudo apt-get install -y gnupg software-properties-common curl
            curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update && sudo apt-get install terraform -y

      - name: 🌐 Deploy para S3 com Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bash ./deploy.sh
